# Ceiling fan + light RF bridge for Home Assistant (ESPHome native API over WiFi).
#
# Replays 433.92 MHz OOK remote codes from a transmitter on XIAO ESP32-C6 D10.
# Protocol and capture history: see README.md (reverse-engineered in fan_control).
#
# Each fan is one `packages:` entry below; adding a fan only takes its remote's
# 16-bit address. Code = 16-bit address + 6-bit model constant + 10-bit command.

substitutions:
  name: fan-esphome
  friendly_name: "Ceiling Fans"
  # Seeed XIAO ESP32-C6: silkscreen D10 == GPIO18
  tx_pin: GPIO18

  # Frame timing (us). Each frame: 32 bits, MSB first, no lead pulse;
  #   bit 1 = HIGH long_us, LOW short_us; bit 0 = HIGH short_us, LOW long_us;
  # then a trailing HIGH short_us and a LOW gap_us. The receiver validates the
  # gap: ~10.3 ms made some buttons fail, 8444 us made all of them work.
  short_us: "274"
  long_us: "768"
  gap_us: "8444"
  repeats: "10"

  # Shared by every remote of this model (bits 16-21).
  model: "010100"
  # 10-bit command fields (bits 22-31), captured from fan 1's remote.
  cmd_speed1: "0000010101"
  cmd_speed2: "0010011101"
  cmd_speed3: "0001110011"
  cmd_speed4: "0010001100"
  cmd_speed5: "0001000000"
  cmd_speed6: "0001010001"
  cmd_fan_off: "0000100110"
  cmd_direction: "1000100100"
  cmd_light_toggle: "0010111111"
  cmd_light_color: "0011011001"
  cmd_light_up: "1101010010"
  cmd_light_down: "1101000011"

packages:
  # Every button captured and verified on the real fan.
  fan1: !include { file: fan.yaml, vars: { n: "1", fan_name: "Fan 1", addr: "1000011001111000" } }
  # Only speed1 captured (11111111100010010101000000010101); the other codes
  # assume this remote shares fan 1's command fields.
  fan2: !include { file: fan.yaml, vars: { n: "2", fan_name: "Fan 2", addr: "1111111110001001" } }
  # fan3: !include { file: fan.yaml, vars: { n: "3", fan_name: "Fan 3", addr: "<first 16 bits of any fan3 code>" } }

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # After every fan and light has restored its state, start transmitting
    # changes (see fan.yaml).
    priority: -100
    then:
      - lambda: "id(rf_ready) = true;"

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Fan-Esphome Fallback"
    password: !secret ap_password

captive_portal:

# XIAO ESP32-C6 antenna RF switch: GPIO3 LOW enables the switch, GPIO14 LOW
# selects the built-in ceramic antenna (HIGH = external U.FL antenna). These
# set up before WiFi, so the radio has an antenna when it starts scanning.
switch:
  - platform: gpio
    id: rf_switch_enable
    pin: GPIO3
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: antenna_select
    pin: GPIO14
    restore_mode: ALWAYS_OFF
    internal: true

remote_transmitter:
  id: rf_tx
  pin: ${tx_pin}
  carrier_duty_percent: 100%   # plain OOK: the module keys the carrier itself
  # Block until the RMT finishes so queued presses go out one after another.
  non_blocking: false

globals:
  - { id: rf_ready, type: bool, initial_value: "false" }

script:
  # Transmit one 32-bit code (a string of 0/1) as `repeats` back-to-back frames
  # in a single RMT transmission, so every gap is exactly gap_us.
  - id: send_rf
    mode: queued
    max_runs: 20
    parameters:
      bits: string
    then:
      - logger.log:
          format: "RF TX %s"
          args: ["bits.c_str()"]
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_tx
          code: !lambda |-
            std::vector<int32_t> v;
            v.reserve(${repeats} * (bits.size() * 2 + 2));
            for (int r = 0; r < ${repeats}; r++) {
              for (char c : bits) {
                if (c == '1') { v.push_back(${long_us}); v.push_back(-${short_us}); }
                else if (c == '0') { v.push_back(${short_us}); v.push_back(-${long_us}); }
              }
              v.push_back(${short_us});
              v.push_back(-${gap_us});
            }
            return v;
