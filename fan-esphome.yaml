# Ceiling fan + light RF bridge for Home Assistant (ESPHome native API over WiFi).
#
# Replays 433.92 MHz OOK remote codes from a transmitter on XIAO ESP32-C6 D10.
# Protocol and capture history: see README.md (reverse-engineered in fan_control).
#
# Each fan is one `packages:` entry below with its remote's 16-bit address.
# Frame = address + 0x5 + button byte + XOR checksum nibble.

substitutions:
  name: fan-esphome
  friendly_name: "Ceiling Fans"
  # Seeed XIAO ESP32-C6: silkscreen D10 == GPIO18
  tx_pin: GPIO18

  # Frame timing (us). Each frame: 32 bits, MSB first, no lead pulse;
  #   bit 1 = HIGH long_us, LOW short_us; bit 0 = HIGH short_us, LOW long_us;
  # then a trailing HIGH short_us and a LOW gap_us. The receiver validates the
  # gap: ~10.3 ms made some buttons fail, 8444 us made all of them work.
  short_us: "274"
  long_us: "768"
  gap_us: "8444"
  repeats: "10"

  # Button bytes (bits 20-27), excluding the computed checksum.
  cmd_speed1: "0x01"
  cmd_speed2: "0x09"
  cmd_speed3: "0x07"
  cmd_speed4: "0x08"
  cmd_speed5: "0x04"
  cmd_speed6: "0x05"
  cmd_fan_off: "0x02"
  cmd_direction: "0x22"
  cmd_light_toggle: "0x0B"
  cmd_light_color: "0x0D"
  cmd_light_up: "0x35"
  cmd_light_down: "0x34"

packages:
  # Every button captured and verified on the real fan.
  fan1: !include { file: fan.yaml, vars: { n: "1", fan_name: "Fan 1", addr: "0x8678" } }
  # Only speed1 captured; remaining buttons use the shared button bytes.
  fan2: !include { file: fan.yaml, vars: { n: "2", fan_name: "Fan 2", addr: "0xFF89" } }
  fan3: !include { file: fan.yaml, vars: { n: "3", fan_name: "Fan 3", addr: "0x548D" } }

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # After every fan has restored its state, start transmitting
    # changes (see fan.yaml).
    priority: -100
    then:
      - lambda: "id(rf_ready) = true;"

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Fan-Esphome Fallback"
    password: !secret ap_password

captive_portal:

# XIAO ESP32-C6 antenna RF switch: GPIO3 LOW enables the switch, GPIO14 LOW
# selects the built-in ceramic antenna, HIGH the external U.FL antenna.
# This board's ceramic antenna path receives nothing (scans find no networks),
# so it uses an external antenna. Set antenna_select to ALWAYS_OFF on a board
# with a working ceramic antenna.
switch:
  - platform: gpio
    id: rf_switch_enable
    pin: GPIO3
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: antenna_select
    pin: GPIO14
    restore_mode: ALWAYS_ON
    internal: true

remote_transmitter:
  id: rf_tx
  pin: ${tx_pin}
  carrier_duty_percent: 100%   # plain OOK: the module keys the carrier itself
  # Block until the RMT finishes so queued presses go out one after another.
  non_blocking: false

globals:
  - { id: rf_ready, type: bool, initial_value: "false" }
  - { id: rf_bits, type: std::string }

script:
  # Build a code from its address and button, then send back-to-back frames
  # in a single RMT transmission, so every gap is exactly gap_us.
  - id: send_rf
    mode: queued
    max_runs: 20
    parameters:
      address: int
      command: int
    then:
      - lambda: |-
          uint32_t frame = (uint32_t(address) << 16) | 0x5000 | (uint32_t(command) << 4);
          uint8_t checksum = 0;
          for (int shift = 4; shift < 32; shift += 4)
            checksum ^= (frame >> shift) & 0xF;
          frame |= checksum;
          std::string b;
          b.reserve(32);
          for (int bit = 31; bit >= 0; bit--)
            b += ((frame >> bit) & 1) ? '1' : '0';
          id(rf_bits) = b;
      - logger.log:
          format: "RF TX %s"
          args: ["id(rf_bits).c_str()"]
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_tx
          code: !lambda |-
            const std::string &b = id(rf_bits);
            std::vector<int32_t> v;
            v.reserve(${repeats} * (b.size() * 2 + 2));
            for (int r = 0; r < ${repeats}; r++) {
              for (char c : b) {
                if (c == '1') { v.push_back(${long_us}); v.push_back(-${short_us}); }
                else if (c == '0') { v.push_back(${short_us}); v.push_back(-${long_us}); }
              }
              v.push_back(${short_us});
              v.push_back(-${gap_us});
            }
            return v;
